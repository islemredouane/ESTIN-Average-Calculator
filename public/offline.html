<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · ESTIN Average Calculator</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#030712">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #030712;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .glow-a {
      position: absolute;
      width: 400px;
      height: 400px;
      top: -100px;
      left: -100px;
      background: rgba(139, 92, 246, 0.25);
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
    }
    .glow-b {
      position: absolute;
      width: 400px;
      height: 400px;
      bottom: -100px;
      right: -100px;
      background: rgba(236, 72, 153, 0.2);
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
    }
    .card {
      position: relative;
      z-index: 10;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 16px rgba(139, 92, 246, 0.6));
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #FFFFFF, #C084FC);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p {
      color: #94A3B8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 24px;
      border-radius: 12px;
      background: linear-gradient(135deg, #8B5CF6, #EC4899);
      color: #FFFFFF;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.2s;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
    .tag {
      margin-top: 20px;
      display: inline-block;
      font-size: 12px;
      color: #64748B;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="glow-a"></div>
  <div class="glow-b"></div>
  <div class="card">
    <img src="/icon.svg" class="logo" alt="ESTIN Logo">
    <h1>You're Offline</h1>
    <p>ESTIN Average Calculator is designed as a fully client-side Progressive Web App. Cached pages and offline calculations remain ready for use.</p>
    <a href="/" class="btn">Launch Calculator</a>
    <div class="tag">ESTIN Béjaïa · Academic Grading Engine</div>
  </div>
</body>
</html>
